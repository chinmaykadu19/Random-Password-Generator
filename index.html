<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container fade-in">
    <h2>Password Generator 🔑</h2>
    <div class="password-box" id="passwordBox">Click Generate</div>

    <!-- ✅ Strength Indicator -->
    <div class="strength-container">
      <div id="strengthBar" class="strength-bar"></div>
      <p id="strengthText">Strength: N/A</p>
    </div>

    <div class="length-input">
      <label for="length">Length: </label>
      <input type="number" id="length" min="4" max="32" value="12">
    </div>

    <div class="options">
      <label><input type="checkbox" id="uppercase" checked> Uppercase</label><br>
      <label><input type="checkbox" id="lowercase" checked> Lowercase</label><br>
      <label><input type="checkbox" id="numbers" checked> Numbers</label><br>
      <label><input type="checkbox" id="symbols" checked> Special Characters</label>
    </div>

    <button onclick="generatePassword()">Generate Password</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
